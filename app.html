<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAMADHAN | Workspace</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet"><style>:root{--b:#070a08;--p:#111711;--l:#344536;--t:#f5f7ef;--m:#a9b0a7;--g:#a7e86b;--r:#ff7474;--y:#ffd66b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,#233d24,transparent 32%),var(--b);color:var(--t);font-family:DM Sans,sans-serif}.shell{max-width:1260px;margin:auto;padding:0 22px}header{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff1d}.brand{color:var(--t);text-decoration:none;letter-spacing:1.5px;font-weight:bold}.brand:before{content:'◆';color:#ff754f;margin-right:7px}.nav{display:flex;gap:8px;align-items:center}.user,.meta{color:var(--m);font-size:12px;line-height:1.65}.view{padding:34px 0 60px}.eyebrow{font-size:10px;color:var(--g);font-weight:bold;letter-spacing:2px}.title{font:600 40px/.98 Fraunces,serif;margin:9px 0}.sub{color:var(--m);font-size:13px}.metrics,.grid,.split{display:grid;gap:12px}.metrics{grid-template-columns:repeat(5,1fr);margin:25px 0}.grid{grid-template-columns:repeat(3,1fr)}.split{grid-template-columns:1fr 1fr}.metric,.card{background:linear-gradient(145deg,#161d16,#0d110d);border:1px solid var(--l);box-shadow:8px 10px #000}.metric{padding:15px}.metric b{display:block;color:var(--g);font:600 28px Fraunces,serif}.metric span{font-size:10px;color:var(--m)}.card{padding:17px}.card h3{font:600 19px Fraunces,serif;margin:8px 0}.card a{color:inherit;text-decoration:none}.badge{display:inline-block;border:1px solid var(--l);padding:4px 7px;font-size:10px;color:var(--g);font-weight:bold}.OVERDUE,.DISPUTED{border-color:#813d3d;color:var(--r)}.DUE_SOON{border-color:#78682e;color:var(--y)}.bar{height:5px;background:#293129;margin:12px 0}.bar i{display:block;height:100%;background:var(--g)}button,input,textarea,select{font:inherit}button{cursor:pointer}.action,.ghost{padding:9px 11px;border:1px solid var(--l);font-size:12px}.action{background:var(--g);color:#071006;border-color:var(--g);font-weight:bold}.ghost{background:#111;color:var(--t)}.danger{background:#391617;color:#ffd7d7}.section{margin-top:31px}.section h2{font:600 27px Fraunces,serif}.attention{border-left:3px solid var(--r);background:#261616;padding:13px;margin:18px 0}.form{display:grid;gap:10px}.form input,.form textarea,.form select{background:#080b08;border:1px solid var(--l);color:var(--t);padding:10px;width:100%}.form textarea{min-height:85px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.event{padding:0 0 14px;border-left:1px solid var(--l);padding-left:15px;font-size:13px}.event:before{content:'●';color:var(--g);margin-left:-21px;margin-right:12px}.event time{display:block;color:var(--m);font-size:10px;margin:3px 0}.notice{background:#172516;border:1px solid #4b753d;padding:13px;margin:18px 0}.empty{color:var(--m)}@media(max-width:760px){.shell{padding:0 15px}.metrics{grid-template-columns:repeat(2,1fr)}.grid,.split{grid-template-columns:1fr}.title{font-size:34px}}</style></head><body><div class="shell"><header><a class="brand" href="/app">SAMADHAN</a><div class="nav"><span class="user" id="who"></span><button class="ghost" onclick="location='/'">Switch role</button><button class="ghost" onclick="localStorage.removeItem('samadhan-user');location='/'">Sign out</button></div></header><main class="view" id="app">Loading shared case data…</main></div><script>const app=document.querySelector('#app'),email=localStorage.getItem('samadhan-user'),E=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),R=(u,o={})=>fetch(u,{...o,headers:{'Content-Type':'application/json','X-Samadhan-User':email,...o.headers}}).then(async r=>{let d=await r.json();if(!r.ok)throw Error(d.error);return d}),D=x=>x?new Date(x).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'Awaiting assignment',T=x=>`<span class="badge ${x}">${E(x).replaceAll('_',' ')}</span>`,post=(c,a,b={})=>R(`/api/challenges/${c.id}/${a}`,{method:'POST',body:JSON.stringify(b)});function Card(c){return `<article class="card"><a href="/case/${c.id}">${T(c.status)} ${c.deadlineState!='NORMAL'?T(c.deadlineState):''}<h3>${E(c.title)}</h3><div class="meta">${c.id} · ${E(c.district)}<br>${T(c.priority)} ${E(c.category)}<br>Owner: ${E(c.assignedOrganization?.name||'Awaiting assignment')}<br>Deadline: ${D(c.deadline)}</div><div class="bar"><i style="width:${c.progress}%"></i></div><div class="meta">${c.progress}% progress · ${c.affectedPeople||0} people affected</div></a></article>`}function Stat(o){return Object.entries(o).map(([k,v])=>`<div class="metric"><b>${v}</b><span>${k.replace(/([A-Z])/g,' $1').toUpperCase()}</span></div>`).join('')}async function Home(){let [me,all,dash]=await Promise.all([R('/api/me'),R('/api/challenges'),R('/api/dashboard')]);let u=me.user,cases=all.challenges;document.querySelector('#who').textContent=`${u.name} · ${u.role}`;if(u.role==='CITIZEN')cases=cases.filter(x=>x.citizenEmail===u.email);if(u.role==='ORGANIZATION')cases=cases.filter(x=>x.assignedOrganizationId===u.organizationId);let small={total:cases.length,active:cases.filter(x=>['ASSIGNED','ACCEPTED','IN_PROGRESS'].includes(x.status)).length,overdue:cases.filter(x=>x.deadlineState==='OVERDUE').length,resolved:cases.filter(x=>x.status==='RESOLVED').length,complaints:cases.reduce((n,x)=>n+x.complaints.length,0)};app.innerHTML=`<p class="eyebrow">${u.role} WORKSPACE ${u.role==='GOVERNMENT'?'· DEMO DATA':''}</p><h1 class="title">${u.role==='GOVERNMENT'?'Government monitoring':u.role==='CITIZEN'?'My challenge tracker':'Organization operations'}</h1><p class="sub">One persistent record connects citizen reporting, responsibility, deadlines, evidence and verification.</p>${u.role==='CITIZEN'?'<button class="action" id="report">+ REPORT A PROBLEM</button>':''}<div class="metrics">${Stat(u.role==='GOVERNMENT'?dash.metrics:small)}</div>${u.role==='GOVERNMENT'?`<section class="attention"><b>ATTENTION REQUIRED</b><div class="meta">🔴 OVERDUE · 🟠 DUE SOON · 🟡 AWAITING RESPONSE</div><div class="grid">${dash.attention.map(Card).join('')||'No attention flags.'}</div></section>`:''}<section class="section"><h2>${u.role==='GOVERNMENT'?'All challenge cases':'Cases assigned to you'}</h2><div class="grid">${cases.map(Card).join('')||'<p class="empty">No cases yet.</p>'}</div></section>${u.role==='GOVERNMENT'?`<section class="section split"><div class="card"><h3>Recent activity</h3>${dash.recent.map(e=>`<div class="event"><time>${D(e.createdAt)} · ${E(e.type)}</time>${E(e.message)}</div>`).join('')}</div><div class="card"><h3>Traceable impact</h3><p class="meta">Metrics are calculated from the shared persistent demo dataset. Seed organizations are explicitly demo organizations, not claims of formal partnership.</p></div></section>`:''}`;if(u.role==='CITIZEN')document.querySelector('#report').onclick=Report}function Report(){app.innerHTML=`<p class="eyebrow">CITIZEN REPORT</p><h1 class="title">Report a problem</h1><form class="form card" id="f"><input name="title" required placeholder="Problem title"><textarea name="description" required placeholder="Detailed description"></textarea><div class="two"><input name="district" required placeholder="District, e.g. Giridih"><input name="location" required placeholder="Location / ward / village"></div><div class="two"><select name="category"><option>Other</option>${['Education','Agriculture','Healthcare','Water Management','Environment','Energy','Urban Development','Accessibility','Public Administration','Rural Livelihoods'].map(x=>`<option>${x}</option>`).join('')}</select><select name="priority"><option value="">AI decides urgency</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select></div><input name="affectedPeople" type="number" placeholder="People affected"><button class="action">SUBMIT & ANALYZE</button></form>`;document.querySelector('#f').onsubmit=async e=>{e.preventDefault();try{let d=await R('/api/challenges',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});location='/case/'+d.challenge.id}catch(x){alert(x.message)}}}async function Case(){let id=location.pathname.split('/').pop(),d=await R('/api/challenges/'+id),c=d.challenge,u=(await R('/api/me')).user,o=c.assignedOrganization;document.querySelector('#who').textContent=`${u.name} · ${u.role}`;app.innerHTML=`<button class="ghost" onclick="location='/app'">← WORKSPACE</button><p class="eyebrow">CASE FILE · ${c.id}</p><h1 class="title">${E(c.title)}</h1><section class="split"><div class="card">${T(c.status)} ${T(c.priority)} ${c.deadlineState!='NORMAL'?T(c.deadlineState):''}<p class="sub">${E(c.description)}</p><div class="meta">${E(c.location)}, ${E(c.district)} · ${c.affectedPeople} people affected<br>Responsible: <b>${E(o?.name||'Not assigned')}</b><br>Deadline: ${D(c.deadline)}</div><div class="bar"><i style="width:${c.progress}%"></i></div><b>${c.progress}% progress</b></div><div class="card"><p class="eyebrow">AI ANALYSIS · ${c.aiAnalysis.confidence}% CONFIDENCE</p><h3>${E(c.aiAnalysis.domain)}</h3><div class="meta">${E(c.aiAnalysis.subdomain)}<br><br><b>Required expertise</b><br>${c.aiAnalysis.requiredExpertise.map(E).join(' · ')}<br><br>${E(c.aiAnalysis.summary)}</div></div></section><div id="actions"></div><section class="section split"><div class="card"><h3>Organization matching</h3>${c.matches.map(m=>`<div class="event"><b>${E(m.organizationId)}</b> · ${m.score}% match<br><span class="meta">${E(m.matchedExpertise.join(', '))}<br>${E(m.why)}</span>${u.role==='GOVERNMENT'&&!c.assignedOrganizationId?`<button class="action assign" data-o="${m.organizationId}">ASSIGN</button>`:''}</div>`).join('')}</div><div class="card"><h3>Progress updates</h3>${c.updates.map(x=>`<div class="event"><time>${D(x.createdAt)} · ${E(x.actor)} · ${x.progress}%</time>${E(x.text)}</div>`).join('')||'<p class="empty">No updates yet.</p>'}</div></section>${c.resolution?`<section class="section card"><h3>Resolution submission</h3><p>${E(c.resolution.summary)}</p><div class="meta"><b>Work completed:</b> ${E(c.resolution.whatWasDone)}<br><b>People benefited:</b> ${c.resolution.peopleBenefited}</div>${c.verification?`<p>${T(c.verification.status)} ${E(c.verification.comment||'')}</p>`:''}</section>`:''}<section class="section split"><div class="card"><h3>Case audit trail</h3>${c.events.slice().reverse().map(x=>`<div class="event"><time>${D(x.createdAt)} · ${E(x.type)} · ${E(x.actor)}</time>${E(x.message)}</div>`).join('')}</div><div class="card"><h3>Complaints</h3>${c.complaints.map(x=>`<div class="event"><time>${x.id} · ${x.status}</time>${E(x.type)} — ${E(x.description)}</div>`).join('')||'<p class="empty">No complaints recorded.</p>'}</div></section>`;Wire(c,u)}function Form(html,fn){document.querySelector('#actions').innerHTML=html;document.querySelector('#act').onsubmit=async e=>{e.preventDefault();try{await fn(Object.fromEntries(new FormData(e.target)));location.reload()}catch(x){alert(x.message)}}}function Wire(c,u){document.querySelectorAll('.assign').forEach(b=>b.onclick=()=>post(c,'assign',{organizationId:b.dataset.o}).then(()=>location.reload()));if(u.role==='ORGANIZATION'&&u.organizationId===c.assignedOrganizationId){if(c.status==='ASSIGNED')document.querySelector('#actions').innerHTML='<button class="action" id="a">ACCEPT RESPONSIBILITY</button>',document.querySelector('#a').onclick=()=>post(c,'accept').then(()=>location.reload());else if(c.status==='ACCEPTED')document.querySelector('#actions').innerHTML='<button class="action" id="a">START WORK</button>',document.querySelector('#a').onclick=()=>post(c,'start').then(()=>location.reload());else if(c.status==='IN_PROGRESS')Form(`<section class="section card"><h3>Post progress</h3><form class="form" id="act"><input name="progress" type="number" value="${c.progress}" min="0" max="100"><textarea name="text" required placeholder="Progress update"></textarea><button class="action">POST PROGRESS</button></form><button class="ghost" id="res">SUBMIT RESOLUTION</button></section>`,b=>post(c,'progress',b)),document.querySelector('#res').onclick=()=>Form(`<section class="section card"><h3>Submit resolution for citizen verification</h3><form class="form" id="act"><input name="summary" required placeholder="Resolution summary"><textarea name="whatWasDone" required placeholder="What was done?"></textarea><input name="peopleBenefited" type="number" placeholder="People benefited"><button class="action">SUBMIT FOR VERIFICATION</button></form></section>`,b=>post(c,'resolution',b));}if(u.role==='CITIZEN'&&u.email===c.citizenEmail){if(c.status==='VERIFICATION')Form(`<section class="notice">The organization submitted a resolution. Confirm only if the outcome is real.<form class="form" id="act"><textarea name="comment" placeholder="Verification note"></textarea><div class="two"><button class="action" name="confirmed" value="true">✓ CONFIRM RESOLUTION</button><button class="ghost danger" name="confirmed" value="false">✕ REPORT ISSUE</button></div></form></section>`,b=>post(c,'verify',{...b,confirmed:b.confirmed==='true'}));else if(c.status!=='RESOLVED')Form(`<section class="section card"><h3>Raise a complaint</h3><form class="form" id="act"><select name="type"><option>No response</option><option>Work not started</option><option>Work delayed</option><option>Problem still exists</option><option>Other</option></select><textarea name="description" required placeholder="Describe what needs attention"></textarea><button class="ghost danger">RAISE COMPLAINT</button></form></section>`,b=>post(c,'complaint',b));}}async function Boot(){if(!email)return location='/';try{location.pathname.startsWith('/case/')?await Case():await Home()}catch(e){app.innerHTML='<p class="empty">'+E(e.message)+'</p>'}}Boot()</script></body></html>
