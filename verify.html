<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAMADHAN | Certificate verification</title><style>body{margin:0;background:#080b08;color:#f5f6ef;font:16px Arial,sans-serif}.box{max-width:700px;margin:12vh auto;padding:35px;background:#121812;border:1px solid #405440}.brand{color:#a7e86b;font-weight:bold;letter-spacing:2px}.valid{color:#a7e86b;font-size:25px}p{color:#b9c0b6;line-height:1.7}button{padding:10px;background:#a7e86b;border:0;font-weight:bold}</style></head><body><main class="box"><p class="brand">◆ SAMADHAN</p><div id="out">Verifying certificate…</div></main><script>const id=location.pathname.split('/').pop();fetch('/api/verify/'+id).then(r=>r.json().then(d=>({r,d}))).then(({r,d})=>document.querySelector('#out').innerHTML=r.ok?`<h1 class="valid">✓ VALID CERTIFICATE</h1><h2>${d.certificate.id}</h2><p><b>Challenge:</b> ${d.certificate.challengeTitle}<br><b>Location:</b> ${d.certificate.location}<br><b>Resolved by:</b> ${d.certificate.organization}<br><b>Resolution:</b> ${d.certificate.resolution}<br><b>People benefited:</b> ${d.certificate.peopleBenefited}<br><b>Verification:</b> VERIFIED</p><button onclick="print()">PRINT CERTIFICATE</button>`:'<h1>Certificate not found</h1>')</script></body></html>
